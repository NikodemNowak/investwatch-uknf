# Real data for `make demo-real` (python -m investwatch.demo --real): every row is fetched live
# through a compliant path (ADR 0008, docs/DATA_ACCESS.md). Nothing here comes from old
# scraping: platform pages are never fetched, YouTube is read only through the Data API
# (skipped without YOUTUBE_API_KEY), and each website goes through InvestWatchBot, which
# obeys robots.txt and records a refusal as a `blocked` item.
#
# Names start with "Realne:" so the Sources page and the summary keep them apart from the
# fictional "Demo:" material. Kept small: one run per day, staggered minutes.

sources:
