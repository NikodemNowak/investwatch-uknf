[project]
name = "investwatch"
version = "0.1.0"
description = "InvestWatch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "python-socketio>=5.11",
    "minio>=7.2",
    "httpx>=0.27",
    "tldextract>=5.1",
    "croniter>=5.0",
    "playwright==1.65.2",  # must match the base image tag in Dockerfile,
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-croniter>=6.2.4.20261118",
    "python-socketio[client]>=5.18.1",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser: needs a Playwright Chromium (skipped when it cannot be launched)",
    "network: hits live platforms; skipped unless RUN_NETWORK_TESTS=1",
]

[[tool.mypy.overrides]]
# Celery and python-socketio decorators are untyped.
module = ["investwatch.jobs.tasks", "investwatch.api.sio"]
disallow_untyped_decorators = false
